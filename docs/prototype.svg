<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800"><rect width="1120" height="800" fill="#E9EDE3"/><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#244D43}.small{font-size:12px;fill:#758276}.h{font-size:25px;font-weight:600}.b{font-size:16px}</style><text x="40" y="42" class="b">ACNE DIARY / 页面结构原型 · 空数据状态 · 非真实用户记录</text><g transform="translate(35 70)"><rect width="330" height="690" rx="30" fill="#F6F5EF"/><text x="23" y="43" class="small">私人皮肤手记</text><text x="23" y="82" class="h">给变化一点时间。</text><rect x="18" y="111" width="294" height="180" rx="24" fill="#DFE8D8"/><text x="36" y="147" class="small">TODAY / 每日观察</text><text x="36" y="190" class="h">今天的皮肤，还好吗？</text><rect x="36" y="225" width="257" height="44" rx="12" fill="#244D43"/><text x="95" y="253" style="fill:white">开始今日记录 ＋</text><rect x="18" y="308" width="294" height="142" rx="20" fill="white"/><text x="35" y="340" class="b">今日概况</text><text x="35" y="382" class="small">暂无数据</text><text x="35" y="413" class="small">观察后填写，不用空值代替0</text><rect x="18" y="467" width="294" height="140" rx="20" fill="white"/><text x="35" y="500" class="b">最近7天 · 新增红肿痘</text><path d="M40 565H290" stroke="#D3DDD0"/><text x="70" y="548" class="small">开始记录，慢慢积累变化</text><text x="25" y="656" class="small">首页　　记录　　趋势　　照片　　我的</text></g><g transform="translate(395 70)"><rect width="330" height="690" rx="30" fill="#F6F5EF"/><text x="23" y="43" class="small">DAILY CHECK-IN</text><text x="23" y="82" class="h">记下今天的皮肤</text><rect x="18" y="110" width="294" height="250" rx="20" fill="white"/><text x="35" y="148" class="b">02 / 痘痘计数</text><text x="35" y="180" class="small">类型　　　　 当前存量　今日新增</text><text x="35" y="224">红肿痘　　 −　—　+　 −　—　+</text><text x="35" y="267">小丘疹　　 −　—　+　 −　—　+</text><text x="35" y="317" class="small">留空为未评估；输入0表示明确没有</text><rect x="18" y="378" width="294" height="227" rx="20" fill="white"/><text x="35" y="414" class="b">03 / 部位分布</text><ellipse cx="165" cy="508" rx="60" ry="75"