name: 构建 Android 测试安装包
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装依赖并验证
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: 生成 Android 原生工程
        run: npx expo prebuild --platform android --no-install
      - name: 安装 Android 编译工具
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: 编译独立 ARM64 测试安装包
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - name: 整理安装包与校验值
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/acne-diary-1.0.2-arm64-preview.apk
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acne-diary-android-preview
          path: apk/
          if-no-files-found: error
          retention-days: 30
